# Wiki Inspi vocabulary, read by src/enrich.py.
# - use_for: CLOSED list. The model may only pick from it; anything else is dropped.
#   Replace the examples with your own projects or purposes.
# - synonyms: variant -> canonical tag. Applied to tags, style, movement, technique, mood
#   after lowercase-kebab normalisation, so "Brutalist" and "brutalisme" make ONE tag.
