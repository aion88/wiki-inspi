<!doctype html><meta charset="utf-8"><title>Wiki Inspi</title>
<style>body{font:14px system-ui;max-width:560px;margin:40px auto;padding:0 16px}input{width:100%;padding:6px;margin:4px 0}button{margin:4px 4px 4px 0;padding:6px 12px}#out{margin-top:12px;white-space:pre-wrap}</style>
<h1>Wiki Inspi</h1>
<p>1. Run <code>scripts/setup-token.sh</code> from the repo in a terminal. 2. Click <b>Pair</b> within 60 seconds.</p>

<button id="pair">Pair</button><button id="save">Save</button><button id="test">Test</button>
<div id="out"></div>
<script src="options.js"></script>
